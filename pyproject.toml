[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "percepteye-fhir-harness"
version = "0.1.0"
description = "PerceptEye FHIR Harness — config-driven clinical agent inference against Open FHIR or AWS HealthLake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "requests-aws4auth>=1.2",
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
tinker = ["tinker>=0.23", "tinker-cookbook", "transformers>=4.45"]

[project.scripts]
pe-harness = "percepteye_fhir_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
percepteye_fhir_harness = ["prompts/*.md"]
